# Local demo profile: PostgreSQL and Redis run in-process, so nothing has to be installed.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# EmbeddedServersConfig supplies the DataSource and the Redis connection factory directly, so the
# datasource URL below is never dialled. The credentials are placeholders that keep property
# resolution happy without requiring DB_USERNAME / DB_PASSWORD in the environment.

spring.datasource.url=jdbc:postgresql://localhost:5432/embedded
spring.datasource.username=embedded
spring.datasource.password=embedded

# Dev-only secrets. Real keys still come from the environment when they are set.
merchant.api.key=${MERCHANT_API_KEY:mk_local_dev_key}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:whsec_local_dev}

logging.level.com.razoryield=DEBUG
logging.level.org.flywaydb=INFO

# Disable Thymeleaf cache for immediate hot-reload of templates in local mode
spring.thymeleaf.cache=false
