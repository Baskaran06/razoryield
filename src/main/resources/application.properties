spring.application.name=razoryield
server.port=8080

# ---- PostgreSQL ----
# No credentials are hardcoded. Supply DB_URL / DB_USERNAME / DB_PASSWORD via the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/razoryield}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Flyway ----
# Flyway owns the schema. Hibernate is not allowed to touch DDL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Redis (daily discount budget circuit breaker) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis holds one counter, not entities. Without this, Spring Data Redis tries to claim the JPA
# repositories during scanning.
spring.data.redis.repositories.enabled=false

# ---- Discount policy ----
orchestrator.policy.global-min-margin-pct=${GLOBAL_MIN_MARGIN_PCT:15}

# ---- Spring AI ----
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# ---- Razorpay (test mode) ----
razorpay.api.key=${RAZORPAY_KEY_ID:}
razorpay.api.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Merchant approval gate ----
merchant.api.key=${MERCHANT_API_KEY:}

logging.level.com.razoryield=INFO
